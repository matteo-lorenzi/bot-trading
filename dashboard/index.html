<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Trading Bot</title>
  <style>
    body { font-family: monospace; background: #111; color: #eee; padding: 2rem; }
    h1 { color: #0f0; }
    table { border-collapse: collapse; width: 100%; margin-bottom: 2rem; }
    th, td { border: 1px solid #333; padding: 0.5rem 1rem; text-align: left; }
    th { background: #222; }
    .positive { color: #0f0; }
    .negative { color: #f44; }
    #status { font-size: 1.2rem; margin-bottom: 1rem; }
    #account { margin-bottom: 1rem; }
  </style>
</head>
<body>
  <h1>Trading Bot</h1>
  <div id="status">Status: connecting...</div>
  <div id="account">Equity: — | Buying Power: —</div>

  <h2>Open Positions</h2>
  <table id="positions-table">
    <thead><tr><th>Symbol</th><th>Qty</th><th>Avg Entry</th><th>Current</th><th>Unrealized P&L</th></tr></thead>
    <tbody id="positions-body"><tr><td colspan="5">—</td></tr></tbody>
  </table>

  <h2>Recent Trades</h2>
  <table id="trades-table">
    <thead><tr><th>Symbol</th><th>Side</th><th>Qty</th><th>Price</th><th>Time</th></tr></thead>
    <tbody id="trades-body"><tr><td colspan="5">—</td></tr></tbody>
  </table>

  <script>
    const fmt = (n) => Number(n).toFixed(2);

    function el(tag, text, cls) {
      const e = document.createElement(tag);
      if (text !== undefined) e.textContent = text;
      if (cls) e.className = cls;
      return e;
    }

    function row(...cells) {
      const tr = document.createElement("tr");
      cells.forEach(c => tr.appendChild(c));
      return tr;
    }

    function connect() {
      const ws = new WebSocket(`ws://${location.host}/ws`);

      ws.onmessage = (event) => {
        const d = JSON.parse(event.data);

        document.getElementById("status").textContent =
          `Status: ${d.status} | Last signal: ${d.last_signal?.symbol ?? "—"} ${d.last_signal?.action ?? ""}`;

        document.getElementById("account").textContent =
          `Equity: $${fmt(d.equity)} | Buying Power: $${fmt(d.buying_power)}`;

        const posBody = document.getElementById("positions-body");
        posBody.replaceChildren();
        if (d.positions.length === 0) {
          const td = el("td", "No open positions");
          td.colSpan = 5;
          posBody.appendChild(row(td));
        } else {
          d.positions.forEach(p => {
            const pl = Number(p.unrealized_pl);
            posBody.appendChild(row(
              el("td", p.symbol),
              el("td", String(p.qty)),
              el("td", `$${fmt(p.avg_entry_price)}`),
              el("td", `$${fmt(p.current_price)}`),
              el("td", `$${fmt(pl)}`, pl >= 0 ? "positive" : "negative"),
            ));
          });
        }

        const trBody = document.getElementById("trades-body");
        trBody.replaceChildren();
        if (d.recent_trades.length === 0) {
          const td = el("td", "No trades yet");
          td.colSpan = 5;
          trBody.appendChild(row(td));
        } else {
          [...d.recent_trades].reverse().forEach(t => {
            trBody.appendChild(row(
              el("td", t.symbol),
              el("td", t.side.toUpperCase()),
              el("td", String(t.qty)),
              el("td", `$${fmt(t.price)}`),
              el("td", new Date(t.timestamp).toLocaleTimeString()),
            ));
          });
        }
      };

      ws.onclose = () => {
        document.getElementById("status").textContent = "Status: disconnected — reconnecting...";
        setTimeout(connect, 3000);
      };
    }

    connect();
  </script>
</body>
</html>
